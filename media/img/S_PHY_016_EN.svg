<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="#ffffff"/><g font-family="Geist, Segoe UI, Arial, sans-serif"><text x="48" y="62" font-size="30" fill="#1d2935" font-weight="bold">Echo, reflection and absorption</text><text x="48" y="94" font-size="17" fill="#677584" font-weight="normal">Sound can return, pass through or lose energy at surfaces</text><line x1="48" y1="112" x2="912" y2="112" stroke="#dce2e7" stroke-width="2"/><text x="80" y="166" font-size="21" fill="#1d2935" font-weight="bold">Echo: round-trip path</text><line x1="412" y1="211" x2="412" y2="480" stroke="#1d2935" stroke-width="9"/><text x="412" y="198" font-size="17" fill="#677584" font-weight="normal" text-anchor="middle">Wall</text><circle cx="112" cy="403" r="18" fill="#ffffff" stroke="#1d2935" stroke-width="4"/><text x="112" y="451" font-size="18" fill="#1d2935" font-weight="normal" text-anchor="middle">Source / ear</text><line x1="132" y1="391" x2="411" y2="288" stroke="#166497" stroke-width="4"/><polygon points="411.0,288.0 395.5,286.5 400.2,299.2" fill="#166497"/><line x1="411" y1="308" x2="139" y2="414" stroke="#c76322" stroke-width="4"/><polygon points="139.0,414.0 154.5,415.3 149.6,402.6" fill="#c76322"/><text x="282" y="315" font-size="18" fill="#166497" font-weight="bold">Outward</text><text x="283" y="431" font-size="18" fill="#c76322" font-weight="bold">Return</text><text x="260" y="507" font-size="19" fill="#1d2935" font-weight="bold" text-anchor="middle">Total path = 2 × d</text><line x1="486" y1="153" x2="486" y2="545" stroke="#dce2e7" stroke-width="2"/><text x="535" y="166" font-size="21" fill="#1d2935" font-weight="bold">At a material boundary</text><rect x="754" y="235" width="34" height="214" rx="2" fill="#e4e8eb" stroke="#1d2935" stroke-width="2"/><text x="772" y="225" font-size="17" fill="#1d2935" font-weight="normal" text-anchor="middle">Material</text><line x1="537" y1="337" x2="747" y2="337" stroke="#166497" stroke-width="5"/><polygon points="747.0,337.0 733.0,330.2 733.0,343.8" fill="#166497"/><text x="566" y="320" font-size="17" fill="#166497" font-weight="bold">Incident</text><line x1="742" y1="318" x2="624" y2="247" stroke="#c76322" stroke-width="4"/><polygon points="624.0,247.0 632.5,260.0 639.5,248.4" fill="#c76322"/><text x="608" y="238" font-size="17" fill="#c76322" font-weight="bold">Reflection</text><line x1="789" y1="337" x2="890" y2="337" stroke="#1c7a6e" stroke-width="4"/><polygon points="890.0,337.0 876.0,330.2 876.0,343.8" fill="#1c7a6e"/><text x="835" y="320" font-size="15" fill="#1c7a6e" font-weight="bold" text-anchor="middle">Transmission</text><text x="772" y="478" font-size="17" fill="#1d2935" font-weight="bold" text-anchor="middle">Absorption</text><text x="772" y="502" font-size="14" fill="#677584" font-weight="normal" text-anchor="middle">Energy e.g. as heat</text><line x1="48" y1="557" x2="912" y2="557" stroke="#dce2e7" stroke-width="2"/><text x="480" y="582" font-size="15" fill="#677584" font-weight="normal" text-anchor="middle">Arrow lengths do not encode measured energy fractions</text></g></svg>