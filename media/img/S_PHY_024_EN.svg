<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" aria-label="Heat-loss paths and energy balance" baseProfile="full" height="600px" role="img" version="1.1" viewBox="0 0 960 600" width="960px">
