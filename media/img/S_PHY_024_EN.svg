  <text fill="#5c6b78" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" x="48" y="84">Model of a room with a defined system boundary</text>
  <line stroke="#cbd5dc" stroke-linecap="round" stroke-width="1.5" x1="48" x2="912" y1="105" y2="105"/>
  <rect fill="white" height="350" rx="3" ry="3" stroke="#cbd5dc" stroke-width="2" width="511" x="48" y="150"/>
  <polygon fill="white" points="111,302 287,187 467,302" stroke="#233648" stroke-width="4"/>
  <rect fill="white" height="155" rx="0" ry="0" stroke="#233648" stroke-width="4" width="294" x="142" y="302"/>
