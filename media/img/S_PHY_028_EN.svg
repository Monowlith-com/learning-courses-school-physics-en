<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Field of a bar magnet</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Field lines are model curves, not wires</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><path d="M350 306 C285 115 548 115 620 306" fill="none" stroke="#156d9d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M350 324 C330 215 550 213 620 324" fill="none" stroke="#156d9d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M350 364 C285 520 548 520 620 364" fill="none" stroke="#156d9d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M350 346 C330 454 550 454 620 346" fill="none" stroke="#156d9d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="350" y="298" width="270" height="74" rx="3" fill="white" stroke="#1d2935" stroke-width="1.5"/><rect x="352" y="300" width="134" height="70" rx="0" fill="#fff1ef" stroke="#fff1ef" stroke-width="1.5"/><rect x="486" y="300" width="132" height="70" rx="0" fill="#edf6fc" stroke="#edf6fc" stroke-width="1.5"/><text x="414" y="331" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">N</text><text x="552" y="331" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">S</text><line x1="553" y1="355" x2="417" y2="355" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><circle cx="809" cy="341" r="45" fill="white" stroke="#1d2935" stroke-width="2"/><line x1="841" y1="341" x2="778" y2="341" stroke="#aa3748" stroke-width="4" stroke-linecap="round" marker-end="url(#redarr)"/><text x="815" y="415" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Compass</text><text x="480" y="560" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Outside N → S; inside S → N – field lines form closed loops.</text></svg>