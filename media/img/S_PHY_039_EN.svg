<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Adding forces and equilibrium</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Add only forces acting on the same object</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="48" y="145" width="866" height="174" rx="9" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="70" y="181" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Unequal forces</text><rect x="411" y="208" width="136" height="58" rx="8" fill="#f3f6f8" stroke="#1d2935" stroke-width="1.5"/><circle cx="437" cy="277" r="15" fill="#fff" stroke="#1d2935" stroke-width="2.7"/><circle cx="521" cy="277" r="15" fill="#fff" stroke="#1d2935" stroke-width="2.7"/><line x1="547" y1="233" x2="726" y2="233" stroke="#156d9d" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="665" y="216" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">+6 N</text><line x1="411" y1="233" x2="285" y2="233" stroke="#aa3748" stroke-width="4" stroke-linecap="round" marker-end="url(#redarr)"/><text x="347" y="216" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">−4 N</text><text x="760" y="269" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Resultant:</text><text x="760" y="293" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">+2 N</text><rect x="48" y="342" width="866" height="188" rx="9" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="70" y="378" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Force equilibrium</text><rect x="411" y="405" width="136" height="58" rx="8" fill="#f3f6f8" stroke="#1d2935" stroke-width="1.5"/><circle cx="437" cy="474" r="15" fill="#fff" stroke="#1d2935" stroke-width="2.7"/><circle cx="521" cy="474" r="15" fill="#fff" stroke="#1d2935" stroke-width="2.7"/><line x1="411" y1="435" x2="285" y2="435" stroke="#aa3748" stroke-width="4" stroke-linecap="round" marker-end="url(#redarr)"/><line x1="547" y1="435" x2="673" y2="435" stroke="#156d9d" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="335" y="418" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">−4 N</text><text x="616" y="418" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">+4 N</text><text x="718" y="467" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Sum: 0 N</text><text x="480" y="566" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">0 N does not necessarily mean rest.</text></svg>