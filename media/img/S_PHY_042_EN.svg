<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Pressure: force per area and depth</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Contact area and water depth are different settings</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="42" y="142" width="427" height="388" rx="9" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="255" y="178" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Contact area</text><line x1="72" y1="411" x2="446" y2="411" stroke="#506173" stroke-width="2" stroke-linecap="round"/><rect x="103" y="309" width="96" height="101" rx="3" fill="#eff4f8" stroke="#1d2935" stroke-width="1.5"/><line x1="151" y1="217" x2="151" y2="300" stroke="#aa3748" stroke-width="3.5" stroke-linecap="round" marker-end="url(#redarr)"/><text x="169" y="255" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">200 N</text><text x="151" y="443" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">A = 0.02 m²</text><text x="151" y="470" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">p = 10 kPa</text><rect x="264" y="352" width="170" height=