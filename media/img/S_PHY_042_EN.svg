ht="700" text-anchor="middle">Δp = ρ g h</text><text x="480" y="570" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Only additional hydrostatic pressure rises linearly with h.</text></svg>