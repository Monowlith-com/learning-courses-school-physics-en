<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Transferring and converting energy</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Bicycle – dynamo – lamp: transfers, not energy consumption</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="42" y="185" width="212" height="149" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="148" y="223" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Cyclist</text><text x="148" y="253" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">chemical energy</text><rect x="356" y="185" width="212" height="149" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="462.0" y="223" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Dynamo</text><text x="462.0" y="253" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">motion → electricity</text><rect x="686" y="185" width="228" height="149" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="800.0" y="223" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Lamp</text><text x="800.0" y="253" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">electrical input</text><line x1="258" y1="262" x2="347" y2="262" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="570" y1="262" x2="675" y2="262" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="302" y="236" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Work</text><text x="630" y="236" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Electricity</text><line x1="798" y1="335" x2="798" y2="389" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><path d="M 798 390 L 529 440" fill="none" stroke="#156d9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 798 390 L 800 441" fill="none" stroke="#aa3748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redarr)"/><rect x="386" y="453" width="270" height="90" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="521.0" y="491" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Light emitted</text><text x="521.0" y="521" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">intended output</text><rect x="683" y="453" width="231" height="90" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="798.5" y="491" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Heating</text><text x="798.5" y="521" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">other energy output</text><text x="479" y="584" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">System boundaries determine whether to call a change a transfer or conversion.</text></svg>