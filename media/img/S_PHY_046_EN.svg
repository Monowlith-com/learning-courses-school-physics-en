<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Conservation of energy with friction</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Initial and final accounts of the same system</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><text x="265" y="173" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Initial</text><text x="695" y="173" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Final</text><rect x="140" y="216" width="235" height="278" rx="7" fill="#eff6fa" stroke="#cbd5df" stroke-width="1.5"/><rect x="560" y="216" width="235" height="194" rx="7" fill="#eff6fa" stroke="#cbd5df" stroke-width="1.5"/><rect x="560" y="410" width="235" height="84" rx="0" fill="#fdf3f1" stroke="#cbd5df" stroke-width="1.5"/><text x="258" y="314" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Gravitational</text><text x="258" y="348" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">100 J</text><text x="677" y="292" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Kinetic</text><text x="677" y="328" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">70 J</text><text x="677" y="449" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">other accounts</text><text x="677" y="480" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">30 J</text><line x1="396" y1="351" x2="534" y2="351" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="480" y="550" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">100 J = 70 J + 30 J</text><text x="480" y="583" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">The red portion is not necessarily frictional heating alone.</text></svg>