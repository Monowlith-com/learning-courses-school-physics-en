<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Work and power when lifting</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Same mass, same height; different duration</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="40" y="152" width="420" height="390" rx="11" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="250" y="192" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">faster</text><line x1="94" y1="441" x2="407" y2="441" stroke="#506173" stroke-width="2" stroke-linecap="round"/><rect x="185" y="269" width="91" height="57" rx="6" fill="#eef4f6" stroke="#1d2935" stroke-width="1.5"/><text x="231" y="303" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">10 kg</text><line x1="324" y1="436" x2="324" y2="277" stroke="#156d9d" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="342" y="361" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400">1.5 m</text><text x="250" y="468" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Lifting work: 147.15 J</text><text x="250" y="503" fill="#1d2935" font-family="DejaVu Sa