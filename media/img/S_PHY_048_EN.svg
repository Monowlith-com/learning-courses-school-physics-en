<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Efficiency – energy is still conserved</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Model motor supplied with 200 J</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="41" y="246" width="253" height="158" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><text x="167.5" y="284" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Input</text><text x="167.5" y="314" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">200 J</text><line x1="306" y1="325" x2="405" y2="325" stroke="#156d9d" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="418" y="226" width="462" height="132" rx="10" fill="#eaf4f0" stroke="#cbd5df" stroke-width="1.5"/><text x="648" y="278" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Useful output</text><text x="648" y="316" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">150 J = 75 %</text><rect x="418" y="375" width="462" height="70" rx="10" fill="#fff4f3" stroke="#cbd5df" stroke-width="1.5"/><text x="648" y="407" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Other outputs</text><text x="648" y="434" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">50 J = 25 %</text><path d="M 402 325 L 405 410 L 418 410" fill="none" stroke="#aa3748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redarr)"/><text x="480" y="505" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">η = 150 J / 200 J = 0.75</text><text x="480" y="554" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">“Not useful” does not mean “destroyed”.</text></svg>