<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Energy stores for different purposes</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Capacity (kWh) and power (kW) are different quantities</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="36" y="153" width="263" height="246" rx="10" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="167" y="194" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Rechargeable battery</text><text x="167" y="229" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Chemical energy</text><rect x="351" y="153" width="263" height="246" rx="10" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="482" y="194" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Pumped storage</text><text x="482" y="229" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Gravitational energy</text><rect x="666" y="153" width="263" height="246" rx="10" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="797" y="194" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Thermal store</text><text x="797" y="229" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Internal energy</text><rect x="108" y="267" width="98" height="80" rx="7" fill="#f2f6fa" stroke="#1d2935" stroke-width="1.5"/><rect x="143" y="254" width="29" height="13" rx="2" fill="#1d2935" stroke="#1d2935" stroke-width="1.5"/><text x="157" y="313" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">+ −</text><line x1="400" y1="340" x2="558" y2="340" stroke="#156d9d" stroke-width="2.6" stroke-linecap="round"/><line x1="417" y1="278" x2="544" y2="278" stroke="#156d9d" stroke-width="3" stroke-linecap="round"/><path d="M 435 289 L 435 340 M 523 340 L 523 382" fill="none" stroke="#156d9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="479" y="367" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Height</text><rect x="737" y="270" width="120" height="83" rx="8" fill="#fff8ee" stroke="#aa3748" stroke-width="1.5"/><path d="M 777 320 C 764 295 796 295 781 275 M 817 320 C 802 295 835 295 823 275" fill="none" stroke="#aa3748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="452" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Example: 3 kWh / 0.75 kW = 4 h</text><text x="480" y="514" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Real duration depends on losses and operating limits.</text></svg>