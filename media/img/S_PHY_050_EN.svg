<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Energy account from measurements</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Ramp model: potential energy – motion – residual</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="38" y="152" width="418" height="368" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><line x1="80" y1="414" x2="416" y2="414" stroke="#506173" stroke-width="2" stroke-linecap="round"/><line x1="122" y1="251" x2="375" y2="414" stroke="#1d2935" stroke-width="3" stroke-linecap="round"/><circle cx="164" cy="281" r="16" fill="#fff" stroke="#156d9d" stroke-width="2.5"/><line x1="164" y1="300" x2="164" y2="413" stroke="#506173" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="195" y1="402" x2="195" y2="314" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><text x="211" y="365" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">h = 0.80 m</text><circle cx="374" cy="397" r="16" fill="#fff" stroke="#156d9d" stroke-width="2.5"/><line x1="396" y1="398" x2="440" y2="398" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="330" y="462" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" 