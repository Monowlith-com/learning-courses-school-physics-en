<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Kirchhoff: junction and loop</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Junction rule = charge balance; loop rule = voltage balance</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="42" y="162" width="420" height="353" rx="12" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="498" y="162" width="420" height="353" rx="12" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="251" y="206" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Junction rule</text><circle cx="264" cy="340" r="8" fill="#1d2935" stroke="#1d2935" stroke-width="2"/><line x1="97" y1="340" x2="244" y2="340" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="278" y1="327" x2="397" y2="259" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><line x1="278" y1="351" x2="397" y2="424" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><text x="143" y="308" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">I = 0.50 A</text><text x="351" y="267" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">I1 = 0.20 A</text><text x="351" y="450" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">I2 = 0.30 A</text><text x="251" y="488" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">I = I1 + I2</text><text x="705" y="206" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Loop rule</text><line x1="580" y1="268" x2="651" y2="268" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><rect x="651" y="251" width="85" height="34" rx="1" fill="#f4f8fb" stroke="#1d2935" stroke-width="1.5"/><text x="693.5" y="273" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">R1</text><line x1="736" y1="268" x2="843" y2="268" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><line x1="843" y1="268" x2="843" y2="329" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><rect x="822" y="329" width="42" height="76" rx="2" fill="#f4f8fb" stroke="#1d2935" stroke-width="1.5"/><text x="843" y="370" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">R2</text><line x1="843" y1="405" x2="843" y2="417" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><line x1="843" y1="417" x2="580" y2="417" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><line x1="580" y1="268" x2="580" y2="294" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><line x1="580" y1="268" x2="580" y2="297" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><line x1="580" y1="417" x2="580" y2="328" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><line x1="553" y1="297" x2="607" y2="297" stroke="#1d2935" stroke-width="3" stroke-linecap="round"/><line x1="565" y1="328" x2="595" y2="328" stroke="#1d2935" stroke-width="3" stroke-linecap="round"/><text x="536" y="300" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">+</text><text x="536" y="341" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">−</text><line x1="580" y1="357" x2="580" y2="417" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round"/><text x="780" y="319" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">U1 = 3 V</text><text x="767" y="462" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">U2 = 6 V</text><text x="704" y="492" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">9 V = 3 V + 6 V</text></svg>