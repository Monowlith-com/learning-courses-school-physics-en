<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Electrical power and energy</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Constant power: energy is area under the P–t graph</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="45" y="152" width="435" height="357" rx="12" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="263" y="202" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Device</text><text x="263" y="268" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">U = 6 V</text><text x="263" y="312" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">I = 0.50 A</text><text x="263" y="386" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">P = U · I = 3 W</text><text x="263" y="447" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">E = 1800 J</text><rect x="509" y="152" width="409" height="357" rx="12" fill="white" stroke="#cbd5df" stroke-width="1.5"/><line x1="564" y1="451" x2="564" y2="232" stroke="#1d2935" stroke-width="2" stroke-linecap="round"/><line x1="564" y1="451" x2="857" y2="451" stroke="#1d2935" stroke-width="2" stroke-linecap="round"/><rect x="564" y="232" width="289" height="219" rx="1" fill="#e7f2f8" stroke="#156d9d" stroke-width="1.5"/><text x="707" y="356" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">3 W</text><text x="707" y="391" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1800 J</text><text x="707" y="478" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">600 s</text><text x="540" y="215" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">P</text><text x="874" y="461" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">t</text><text x="480" y="560" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Only for constant power: E = P × t.</text></svg>