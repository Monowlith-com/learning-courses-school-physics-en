<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Three distinct electrical protection roles</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Functional principles – not instructions for mains wiring</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="38" y="169" width="256" height="315" rx="12" fill="white" stroke="#cbd5df" stroke-width="1.5"/><circle cx="166" cy="254" r="54" fill="white" stroke="#156d9d" stroke-width="4"/><text x="166" y="265" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">PE</text><text x="166" y="344" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Protective earth</text><text x="166" y="396" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Touch-accessible metal</text><text x="166" y="423" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">parts protected</text><rect x="352" y="169" width="256" height="315" rx="12" fill="white" stroke="#cbd5df" stroke-width="1.5"/><circle cx="480" cy="254" r="54" fill="white" stroke="#aa3748" stroke-width="4"/><text x="480" y="265" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">MCB</text><text x="480" y="344" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Overcurrent protection</text><text x="480" y="396" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Protect wiring</text><text x="480" y="423" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">against overheating</text><rect x="666" y="169" width="256" height="315" rx="12" fill="white" stroke="#cbd5df" stroke-width="1.5"/><circle cx="794" cy="254" r="54" fill="white" stroke="#24745c" stroke-width="4"/><text x="794" y="265" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">RCD</text><text x="794" y="344" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Residual-current protection</text><text x="794" y="396" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Detect current</text><text x="794" y="423" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">imbalance</text><text x="480" y="547" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Never perform mains-wiring demonstrations with these devices.</text></svg>