<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Electricity supply as energy flow</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Generation – transmission – demand; storage has losses</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="45" y="233" width="161" height="108" rx="9" fill="white" stroke="#156d9d" stroke-width="1.5"/><text x="125.5" y="294" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Wind turbine</text><rect x="245" y="233" width="160" height="108" rx="9" fill="white" stroke="#24745c" stroke-width="1.5"/><text x="325.0" y="294" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Transformer</text><rect x="449" y="233" width="159" height="108" rx="9" fill="white" stroke="#156d9d" stroke-width="1.5"/><text x="528.5" y="294" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Grid</text><rect x="673" y="233" width="236" height="108" rx="9" fill="white" stroke="#24745c" stroke-width="1.5"/><text x="791.0" y="294" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Consumers</text><line x1="207" y1="285" x2="239" y2="285" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="408" y1="285" x2="441" y2="285" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="610" y1="285" x2="662" y2="285" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="452" y="402" width="187" height="91" rx="8" fill="white" stroke="#24745c" stroke-width="1.5"/><text x="546" y="453" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Storage</text><line x1="545" y1="345" x2="545" y2="400" stroke="#24745c" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr)"/><line x1="567" y1="400" x2="567" y2="345" stroke="#aa3748" stroke-width="2.8" stroke-linecap="round" marker-end="url(#redarr)"/><text x="698" y="389" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Losses</text><line x1="644" y1="436" x2="793" y2="436" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><text x="480" y="190" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Electrical energy</text><line x1="44" y1="524" x2="916" y2="524" stroke="#cbd5df" stroke-width="1.3" stroke-linecap="round"/><text x="480" y="557" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Storage shifts energy in time; it does not create new energy.</text></svg>