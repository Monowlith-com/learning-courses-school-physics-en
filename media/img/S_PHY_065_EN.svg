<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Radiation meeting a material sample</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Energy budget: reflection + transmission + absorption</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="42" y="155" width="876" height="348" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="433" y="233" width="97" height="190" rx="9" fill="white" stroke="#156d9d" stroke-width="1.5"/><line x1="452" y1="238" x2="452" y2="418" stroke="#dce5ea" stroke-width="1" stroke-linecap="round"/><line x1="472" y1="238" x2="472" y2="418" stroke="#dce5ea" stroke-width="1" stroke-linecap="round"/><line x1="492" y1="238" x2="492" y2="418" stroke="#dce5ea" stroke-width="1" stroke-linecap="round"/><line x1="512" y1="238" x2="512" y2="418" stroke="#dce5ea" stroke-width="1" stroke-linecap="round"/><line x1="155" y1="329" x2="425" y2="329" stroke="#156d9d" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="228" y="306" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Incident: 100 W</text><line x1="434" y1="312" x2="317" y2="201" stroke="#aa3748" stroke-width="2.8" stroke-linecap="round" marker-end="url(#redarr)"/><text x="272" y="191" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Reflection 20 W</text><line x1="532" y1="329" x2="778" y2="329" stroke="#24745c" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="706" y="308" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Transmission 35 W</text><line x1="482" y1="338" x2="482" y2="453" stroke="#aa3748" stroke-width="2.8" stroke-linecap="round" marker-end="url(#redarr)"/><text x="486" y="478" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Absorption 45 W</text><line x1="452" y1="241" x2="369" y2="225" stroke="#506173" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 6"/><text x="605" y="183" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Scattering may already be included in R or T</text><path d="M 369 225 L 311 234" fill="none" stroke="#506173" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><line x1="38" y1="529" x2="922" y2="529" stroke="#cbd5df" stroke-width="1.5" stroke-linecap="round"/><text x="480" y="559" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Do not add a fourth fraction: do not double-count scattered radiation.</text></svg>