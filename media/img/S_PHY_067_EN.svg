<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Earth’s global radiation budget</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Rounded global means at the top of atmosphere (W/m²)</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><line x1="67" y1="224" x2="891" y2="224" stroke="#506173" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/><text x="473" y="208" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Top of atmosphere</text><rect x="167" y="412" width="632" height="55" rx="16" fill="white" stroke="#24745c" stroke-width="1.5"/><text x="483" y="445" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Earth’s surface</text><rect x="167" y="310" width="632" height="58" rx="16" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="483" y="346" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Atmosphere (model)</text><line x1="256" y1="141" x2="256" y2="295" stroke="#156d9d" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="150" y="146" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="midd