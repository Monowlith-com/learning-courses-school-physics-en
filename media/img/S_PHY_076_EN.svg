<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Vector and components</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Example: displacement 3 m east and 4 m north</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><line x1="190" y1="490" x2="804" y2="490" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><line x1="245" y1="514" x2="245" y2="164" stroke="#1d2935" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="823" y="496" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">x</text><text x="236" y="147" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">y</text><line x1="245" y1="190" x2="470" y2="190" stroke="#cbd5df" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="470" y1="190" x2="470" y2="490" stroke="#cbd5df" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="245" y1="490" x2="470" y2="190" stroke="#aa3748" stroke-width="3.4" stroke-linecap="round" marker-end="url(#redarr)"/><text x="357" y="511" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">3 m</text><text x="505" y="351" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">4 m</text><text x="352" y="306" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">5 m</text><text x="575" y="247" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Vector (3, 4) m</text><text x="575" y="284" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Magnitude = 5 m</text><text x="575" y="339" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400">Distance here = 7 m</text><text x="575" y="368" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">(two path segments)</text><line x1="38" y1="530" x2="922" y2="530" stroke="#cbd5df" stroke-width="1.5" stroke-linecap="round"/><text x="480" y="565" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Components are perpendicular projections; both axes use the same scale.</text></svg>