<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Claim, evidence, reasoning, limitation</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">A model must explain evidence and state its domain of validity</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="48" y="184" width="180" height="164" rx="10" fill="white" stroke="#156d9d" stroke-width="1.5"/><text x="138" y="228" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Claim</text><text x="138" y="291" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">about 2 m/s</text><rect x="276" y="184" width="180" height="164" rx="10" fill="white" stroke="#24745c" stroke-width="1.5"/><text x="366" y="228" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Evidence</text><text x="366" y="291" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">4 readings</text><rect x="504" y="184" width="180" height="164" rx="10" fill="white" stroke="#156d9d" stroke-width="1.5"/><text x="594" y="228" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Reasoning</text><text x="594" y="291" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">line + residuals</text><rect x="732" y="184" width="180" height="164" rx="10" fill="white" stroke="#aa3748" stroke-width="1.5"/><text x="822" y="228" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Limitation</text><text x="822" y="291" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">only 0–3 s</text><line x1="235" y1="263" x2="268" y2="263" stroke="#156d9d" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arr)"/><line x1="463" y1="263" x2="496" y2="263" stroke="#156d9d" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arr)"/><line x1="691" y1="263" x2="724" y2="263" stroke="#156d9d" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arr)"/><rect x="66" y="392" width="828" height="104" rx="8" fill="#fbfcfd" stroke="#cbd5df" stroke-width="1.5"/><text x="480" y="426" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Model: x = 1.5 m + (2 m/s) · t</text><text x="480" y="464" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Residuals: 0; −0.1; +0.1; −0.1 m</text><line x1="38" y1="530" x2="922" y2="530" stroke="#cbd5df" stroke-width="1.5" stroke-linecap="round"/><text x="480" y="565" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Good agreement is not a universal proof.</text></svg>