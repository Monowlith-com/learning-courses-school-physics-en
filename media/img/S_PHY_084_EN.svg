<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Force balance on a crate</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">m = 2 kg · pull 10 N · kinetic friction 2 N</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><line x1="95" y1="417" x2="866" y2="417" stroke="#1d2935" stroke-width="2.4" stroke-linecap="round"/><rect x="420" y="310" width="130" height="107" rx="9" fill="white" stroke="#1d2935" stroke-width="1.5"/><text x="485" y="365" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">m = 2 kg</text><line x1="485" y1="363" x2="750" y2="363" stroke="#24745c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="684" y="345" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Pull 10 N</text><line x1="485" y1="389" x2="335" y2="389" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><text x="274" y="368" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Friction 2 N</text><line x1="482" y1="310" x2="482" y2="193" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="554" y="217" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">N ≈ 19.6 N</text><line x1="513" y1="365" x2="513" y2="487" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><text x="607" y="484" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Fg ≈ 19.6 N</text><rect x="90" y="155" width="256" height="102" rx="8" fill="#f8fafc" stroke="#cbd5df" stroke-width="1.5"/><text x="218" y="188" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Horizontal: 10 – 2 = 8 N</text><text x="218" y="223" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">a = 8 / 2 = 4 m/s²</text><line x1="40" y1="528" x2="920" y2="528" stroke="#cbd5df" stroke-width="1.4" stroke-linecap="round"/><text x="480" y="558" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Add external forces on the same body; vertical forces balance.</text></svg>