<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Velocity and acceleration around a circle</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Example: r = 2 m, period T = 4 s</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><circle cx="405" cy="331" r="164" fill="white" stroke="#156d9d" stroke-width="2.4"/><circle cx="405" cy="331" r="5" fill="#156d9d" stroke="#156d9d" stroke-width="2"/><line x1="405" y1="331" x2="569" y2="331" stroke="#cbd5df" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><text x="488" y="321" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">r</text><circle cx="569" cy="331" r="13" fill="white" stroke="#1d2935" stroke-width="2"/><line x1="569" y1="331" x2="569" y2="187" stroke="#24745c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="646" y="197" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">v</text><line x1="569" y1="331" x2="439" y2="331" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><text x="521" y="312" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">a</text><rect x="660" y="236" width="251" height="205" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="784" y="273" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Tangential</text><text x="784" y="315" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Centripetal</text><text x="783" y="356" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">v ≈ 3.14 m/s</text><text x="786" y="393" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">a ≈ 4.93 m/s²</text><text x="405" y="318" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">M</text><line x1="40" y1="528" x2="920" y2="528" stroke="#cbd5df" stroke-width="1.4" stroke-linecap="round"/><text x="480" y="558" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Velocity tangent; acceleration and net radial force point to the centre.</text></svg>