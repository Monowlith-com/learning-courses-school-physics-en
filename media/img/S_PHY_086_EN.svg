<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Resolving forces on a ramp</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Model: 30° slope · sliding downhill</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><path d="M180 468 L700 468 L700 168 Z" fill="#fbfcfd" stroke="#cbd5df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="180" y1="468" x2="700" y2="168" stroke="#1d2935" stroke-width="3.2" stroke-linecap="round"/><text x="683" y="497" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Horizontal</text><text x="618" y="454" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">30°</text><rect x="412" y="286" width="62" height="57" rx="6" fill="white" stroke="#1d2935" stroke-width="1.5"/><line x1="438" y1="306" x2="438" y2="467" stroke="#aa3748" stroke-width="3" stroke-linecap="round" marker-end="url(#redarr)"/><text x="476" y="448" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Fg = mg</text><line x1="438" y1="306" x2="342" y2="362" stroke="#24745c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="285" y="387" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">F∥</text><line x1="438" y1="306" x2="381" y2="210" stroke="#156d9d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="345" y="193" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">N</text><line x1="438" y1="306" x2="498" y2="410" stroke="#506173" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="530" y="397" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">F⊥</text><rect x="702" y="240" width="220" height="189" rx="8" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="808" y="280" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Along slope</text><text x="811" y="311" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">mg · sin α</text><text x="811" y="356" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Normal force</text><text x="811" y="390" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">mg · cos α</text><line x1="40" y1="528" x2="920" y2="528" stroke="#cbd5df" stroke-width="1.4" stroke-linecap="round"/><text x="480" y="558" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">F∥ and F⊥ are components of weight; N is a separate contact force.</text></svg>