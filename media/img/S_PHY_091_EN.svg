<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Momentum balance for coupled carts</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">1 kg at +4 m/s hits 3 kg at rest – then both move at +1 m/s</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="50" y="146" width="415" height="348" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="490" y="146" width="420" height="348" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="258" y="184" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Before</text><text x="700" y="184" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">After</text><line x1="90" y1="341" x2="430" y2="341" stroke="#1d2935" stroke-width="2" stroke-linecap="round"/><line x1="531" y1="341" x2="870" y2="341" stroke="#1d2935" stroke-width="2" stroke-linecap="round"/><rect x="113" y="262" width="104" height="78" rx="7" fill="#e9f2fb" stroke="#156d9d" stroke-width="1.5"/><text x="165" y="295" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">1 kg</text><text x="165" y="319" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">+4 m/s</text><rect x="345" y="262" width="104" height="78" rx="7" fill="#e9f5ed" stroke="#24745c" stroke-width="1.5"/><text x="396" y="295" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">3 kg</text><text x="396" y="319" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">0 m/s</text><line x1="132" y1="221" x2="299" y2="221" stroke="#156d9d" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/><text x="217" y="207" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">p = 4</text><rect x="584" y="262" width="224" height="78" rx="7" fill="#e9f2fb" stroke="#156d9d" stroke-width="1.5"/><line x1="681" y1="270" x2="681" y2="331" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><text x="635" y="295" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1 kg</text><text x="745" y="295" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3 kg</text><text x="692" y="324" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">+1 m/s</text><line x1="600" y1="221" x2="781" y2="221" stroke="#156d9d" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/><text x="692" y="207" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">p = 1 + 3 = 4</text><text x="259" y="415" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">K = 8 J</text><text x="700" y="415" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">K = 2 J</text><line x1="42" y1="523" x2="918" y2="523" stroke="#cbd5df" stroke-width="1.2" stroke-linecap="round"/><text x="480" y="556" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Total momentum = 4 kg·m/s before and after; ΔK = −6 J.</text></svg>