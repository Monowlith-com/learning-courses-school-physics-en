<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Comparing two collision models</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Equal masses, 1 kg each; initially v₁ = +2 m/s, v₂ = 0</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="47" y="143" width="865" height="166" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="47" y="325" width="865" height="173" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="200" y="180" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Elastic</text><text x="200" y="213" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">After: 0 and +2 m/s</text><rect x="466" y="192" width="120" height="63" rx="7" fill="#edf5fb" stroke="#156d9d" stroke-width="1.5"/><text x="526" y="229" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">0</text><rect x="677" y="192" width="120" height="63" rx="7" fill="#edf5fb" stroke="#156d9d" stroke-width="1.5"/><text x="736" y="229" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">+2</text><line x1="589" y1="223" x2="656" y2="223" stroke="#24745c" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/><text x="772" y="286" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">p = 2  |  K = 2 J</text><text x="211" y="365" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Perfectly inelastic</text><text x="203" y="402" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">After: both +1 m/s</text><rect x="510" y="375" width="252" height="68" rx="8" fill="#fceef0" stroke="#aa3748" stroke-width="1.5"/><text x="636" y="418" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">+1 m/s +1 m/s</text><text x="744" y="476" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">p = 2  |  K = 1 J</text><line x1="42" y1="523" x2="918" y2="523" stroke="#cbd5df" stroke-width="1.2" stroke-linecap="round"/><text x="480" y="556" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Momentum is 2 kg·m/s in both; kinetic energy is 2 J only if elastic.</text></svg>