<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Satellite on an ideal circular orbit</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Gravity supplies centripetal force; r measured from Earth’s centre</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="45" y="146" width="572" height="356" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="637" y="146" width="281" height="356" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><circle cx="319" cy="332" r="148" fill="white" stroke="#156d9d" stroke-width="2.4"/><circle cx="319" cy="332" r="73" fill="#eaf2f8" stroke="#156d9d" stroke-width="2.5"/><text x="319" y="338" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Earth</text><circle cx="467" cy="332" r="12" fill="#fce3e8" stroke="#aa3748" stroke-width="2"/><line x1="467" y1="332" x2="467" y2="224" stroke="#aa3748" stroke-width="3.3" stroke-linecap="round" marker-end="url(#redarr)"/><line x1="453" y1="332" x2="395" y2="332" stroke="#156d9d" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="319" y1="332" x2="467" y2="332" stroke="#cbd5df" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><text x="397" y="320" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">r</text><text x="523" y="224" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">v</text><text x="395" y="361" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">F</text><text x="764" y="194" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Circular orbit</text><text x="770" y="243" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">v = √(GM/r)</text><text x="770" y="291" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">T = 2πr/v</text><text x="770" y="339" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">r = 7.00 · 10⁶ m</text><text x="770" y="387" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">v ≈ 7546 m/s</text><text x="770" y="435" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">T ≈ 97.1 min</text><line x1="42" y1="523" x2="918" y2="523" stroke="#cbd5df" stroke-width="1.2" stroke-linecap="round"/><text x="480" y="556" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Free fall with tangential velocity; illustration not to scale.</text></svg>