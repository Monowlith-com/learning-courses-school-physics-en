<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Where constant g breaks down</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Comparison: near surface and at altitude h = R</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="47" y="146" width="409" height="352" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="474" y="146" width="437" height="352" rx="9" fill="white" stroke="#cbd5df" stroke-width="1.5"/><text x="250" y="186" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Near surface</text><text x="695" y="186" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">High altitude</text><circle cx="252" cy="338" r="79" fill="#e9f2fb" stroke="#156d9d" stroke-width="2"/><text x="252" y="343" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Earth</text><circle cx="252" cy="248" r="9" fill="#aa3748" stroke="#aa3748" stroke-width="2"/><line x1="252" y1="249" x2="252" y2="304" stroke="#156d9d" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/><text x="254" y="231" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">h ≪ R</text><text x="252" y="451" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">g ≈ g₀</text><circle cx="657" cy="347" r="54" fill="#e9f2fb" stroke="#156d9d" stroke-width="2"/><text x="657" y="353" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Earth</text><circle cx="796" cy="347" r="10" fill="#aa3748" stroke="#aa3748" stroke-width="2"/><line x1="657" y1="347" x2="795" y2="347" stroke="#cbd5df" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="794" y1="348" x2="737" y2="348" stroke="#156d9d" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/><text x="725" y="326" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">r = 2R</text><text x="696" y="451" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">g = g₀/4</text><line x1="42" y1="523" x2="918" y2="523" stroke="#cbd5df" stroke-width="1.2" stroke-linecap="round"/><text x="480" y="556" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Acceleration decreases with 1/r²; a single constant g is not universal.</text></svg>