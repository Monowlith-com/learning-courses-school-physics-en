<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Field and force between parallel plates</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Model: U = 120 V, d = 0.040 m, E = 3000 V/m</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="45" y="149" width="565" height="354" rx="8" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="632" y="149" width="285" height="354" rx="8" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="140" y="201" width="28" height="254" rx="3" fill="#fff0f0" stroke="#aa3748" stroke-width="1.5"/><rect x="482" y="201" width="28" height="254" rx="3" fill="#edf6fc" stroke="#156d9d" stroke-width="1.5"/><text x="154" y="190" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">+</text><text x="496" y="190" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">−</text><line x1="190" y1="228" x2="452" y2="228" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="190" y1="269" x2="452" y2="269" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="190" y1="310" x2="452" y2="310" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="190" y1="351" x2="452" y2="351" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="190" y1="392" x2="452" y2="392" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="190" y1="433" x2="452" y2="433" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="320" cy="305" r="19" fill="white" stroke="#aa3748" stroke-width="2"/><text x="320" y="313" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">+</text><line x1="343" y1="305" x2="420" y2="305" stroke="#aa3748" stroke-width="3.1" stroke-linecap="round" marker-end="url(#redarr)"/><text x="382" y="290" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">F</text><circle cx="320" cy="391" r="19" fill="white" stroke="#156d9d" stroke-width="2"/><text x="320" y="399" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">−</text><line x1="297" y1="391" x2="238" y2="391" stroke="#aa3748" stroke-width="3.1" stroke-linecap="round" marker-end="url(#redarr)"/><text x="248" y="377" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">F</text><text x="324" y="473" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">positive q: →   negative q: ←</text><text x="772" y="210" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Field strength</text><text x="772" y="272" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">E = U / d</text><text x="772" y="335" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">3000 V/m</text><text x="772" y="399" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">F = q · E</text><line x1="40" y1="526" x2="920" y2="526" stroke="#cbd5df" stroke-width="1" stroke-linecap="round"/><text x="480" y="555" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Near plate edges, the field is not exactly uniform.</text></svg>