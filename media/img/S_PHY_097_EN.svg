<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Potential, voltage and field work</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Positive charge moves along the field from A to B</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="52" y="149" width="850" height="354" rx="8" fill="white" stroke="#cbd5df" stroke-width="1.5"/><rect x="125" y="219" width="28" height="232" rx="2" fill="#fff0f0" stroke="#aa3748" stroke-width="1.5"/><rect x="772" y="219" width="28" height="232" rx="2" fill="#edf6fc" stroke="#156d9d" stroke-width="1.5"/><text x="139" y="204" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">+</text><text x="785" y="204" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">−</text><line x1="177" y1="265" x2="737" y2="265" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="177" y1="340" x2="737" y2="340" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="177" y1="415" x2="737" y2="415" stroke="#156d9d" stroke-width="3.1" stroke-linecap="round" marker-end="url(#arr)"/><text x="250" y="242" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">A</text><text x="679" y="242" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">B</text><circle cx="250" cy="342" r="21" fill="white" stroke="#aa3748" stroke-width="2"/><text x="250" y="350" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">q+</text><line x1="288" y1="341" x2="641" y2="341" stroke="#aa3748" stroke-width="3.1" stroke-linecap="round" marker-end="url(#redarr)"/><text x="457" y="324" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Field work W &gt; 0</text><text x="459" y="391" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">U(A,B) = 200 V</text><text x="457" y="462" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">ΔEpot = −q · U(A,B)</text><line x1="40" y1="526" x2="920" y2="526" stroke="#cbd5df" stroke-width="1" stroke-linecap="round"/><text x="480" y="555" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Signs: U(A,B) = φ(A) − φ(B); A is at higher potential.</text></svg>