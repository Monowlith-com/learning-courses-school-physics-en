<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Magnetic flux through a surface</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Angle to surface normal · uniform-field model</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="46" y="140" width="543" height="365" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><rect x="608" y="140" width="305" height="365" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><path d="M 156 380 L 405 380 L 484 439 L 235 439 Z" fill="#f5fafc" stroke="#156d9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="315" y="415" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">A</text><line x1="320" y1="408" x2="320" y2="238" stroke="#aa3748" stroke-width="2.5" stroke-linecap="round" marker-end="url(#redarr)"/><text x="302" y="222" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">n</text><line x1="159" y1="317" x2="254" y2="205" stroke="#156d9d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><line x1="255" y1="310" x2="350" y2="198" stroke="#156d9d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><line x1="349" y1="307" x2="444" y2="195" stroke="#156d9d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><line x1="438" y1="321" x2="533" y2="209" stroke="#156d9d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="495" y="213" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">B</text><path d="M 320 306 Q 350 308 363 290" fill="none" stroke="#aa3748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="364" y="289" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">θ</text><text x="320" y="476" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Normal n perpendicular to area</text><text x="761" y="211" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Φ = B A cos θ</text><text x="761" y="292" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">θ = 0°   →   BA</text><text x="761" y="357" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">θ = 60°  →  BA / 2</text><text x="761" y="423" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">θ = 90°  →  0</text><line x1="40" y1="525" x2="920" y2="525" stroke="#cbd5df" stroke-width="1" stroke-linecap="round"/><text x="480" y="552" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Surface orientation sets the sign of flux.</text></svg>