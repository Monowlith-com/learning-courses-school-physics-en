<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Lenz’s law: increasing flux</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">External B out of page increases; the loop creates opposing B</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="54" y="146" width="550" height="355" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><rect x="623" y="146" width="283" height="355" rx="10" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><circle cx="191" cy="239" r="9" fill="white" stroke="#156d9d" stroke-width="2"/><circle cx="191" cy="239" r="3" fill="#156d9d" stroke="#156d9d" stroke-width="0"/><circle cx="191" cy="368" r="9" fill="white" stroke="#156d9d" stroke-width="2"/><circle cx="191" cy="368" r="3" fill="#156d9d" stroke="#156d9d" stroke-width="0"/><circle cx="329" cy="239" r="9" fill="white" stroke="#156d9d" stroke-width="2"/><circle cx="329" cy="239" r="3" fill="#156d9d" stroke="#156d9d" stroke-width="0"/><circle cx="329" cy="368" r="9" fill="white" stroke="#156d9d" stroke-width="2"/><circle cx="329" cy="368" r="3" fill="#156d9d" stroke="#156d9d" stroke-width="0"/><circle cx="468" cy="239" r="9" fill="white" stroke="#156d9d" stroke-width="2"/><circle cx="468" cy="239" r="3" fill="#156d9d" stroke="#156d9d" stroke-width="0"/><circle cx="468" cy="368" r="9" fill="white" stroke="#156d9d" stroke-width="2"/><circle cx="468" cy="368" r="3" fill="#156d9d" stroke="#156d9d" stroke-width="0"/><circle cx="329" cy="320" r="118" fill="none" stroke="#156d9d" stroke-width="4"/><path d="M 413 236 A 118 118 0 0 1 447 329" fill="none" stroke="#aa3748" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redarr)"/><text x="329" y="172" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Increasing: external B ⊙</text><text x="328" y="480" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Induced current: clockwise</text><circle cx="742" cy="264" r="11" fill="white" stroke="#24745c" stroke-width="2"/><line x1="738" y1="260" x2="746" y2="268" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><line x1="738" y1="268" x2="746" y2="260" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><circle cx="806" cy="264" r="11" fill="white" stroke="#24745c" stroke-width="2"/><line x1="802" y1="260" x2="810" y2="268" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><line x1="802" y1="268" x2="810" y2="260" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><circle cx="742" cy="335" r="11" fill="white" stroke="#24745c" stroke-width="2"/><line x1="738" y1="331" x2="746" y2="339" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><line x1="738" y1="339" x2="746" y2="331" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><circle cx="806" cy="335" r="11" fill="white" stroke="#24745c" stroke-width="2"/><line x1="802" y1="331" x2="810" y2="339" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><line x1="802" y1="339" x2="810" y2="331" stroke="#24745c" stroke-width="2" stroke-linecap="round"/><text x="765" y="203" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Induced field</text><text x="765" y="396" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">into page ⊗</text><text x="765" y="457" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Opposes flux rise</text><line x1="40" y1="525" x2="920" y2="525" stroke="#cbd5df" stroke-width="1" stroke-linecap="round"/><text x="480" y="552" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">It opposes the change of flux, not always the field itself.</text></svg>