<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#156d9d"/></marker><marker id="redarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa3748"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#fff"/><text x="42" y="48" fill="#1d2935" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Compton scattering: energy and momentum</text><text x="42" y="81" fill="#506173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Scattering direction affects the photon wavelength</text><line x1="40" y1="105" x2="920" y2="105" stroke="#cbd5df" stroke-width="1.7" stroke-linecap="round"/><rect x="43" y="142" width="875" height="365" rx="9" fill="#fff" stroke="#cbd5df" stroke-width="1.5"/><circle cx="432" cy="336" r="27" fill="#dff3eb" stroke="#24745c" stroke-width="2.4"/><text x="432" y="344" fill="#24745c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">e⁻</text><line x1="114" y1="336" x2="397" y2="336" stroke="#156d9d" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><line x1="446" y1="308" x2="630" y2="182" stroke="#aa3748" stroke-width="3.5" stroke-linecap="round" marker-end="url(#redarr)"/><line x1="452" y1="356" x2="639" y2="439" stroke="#24745c" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="197" y="306" fill="#156d9d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">incoming photon</text><text x="761" y="211" fill="#aa3748" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">scattered photon</text><text x="754" y="481" fill="#24745c