<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="40" y="56" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="bold" fill="#222933" text-anchor="start">Simplified Planetary Radiation Budget</text><text x="40" y="88" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#5b6776" text-anchor="start">Radiation at the top of atmosphere</text><line x1="40" y1="105" x2="920" y2="105" stroke="#d5d9df" stroke-width="2" stroke-linecap="round"/><rect x="72" y="140" width="815" height="72" rx="12" fill="#eef2f5" stroke="none" stroke-width="2"/><text x="480" y="169" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#222933" text-anchor="middle">Top of atmosphere</text><text x="480" y="195" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#5b6776" text-anchor="middle">Global mean teaching values</text><line x1="80" y1="244" x2="880" y2="244" stroke="#d5d9df" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="200" y1="250" x2="200" y2="458" stroke="#c17a24" stroke-width="8" stroke-linecap="round"/><polygon points="200,458 194.6,446.2 205.4,446.2" fill="#c17a24"/><line x1="475" y1="456" x2="475" y2="260" stroke="#27659a" stroke-width="8" stroke-linecap="round"/><polygon points="475,260 480.4,271.8 469.6,271.8" fill="#27659a"/><line x1="755" y1="457" x2="755" y2="260" stroke="#b3443a" stroke-width="8" stroke-linecap="round"/><polygon points="755,260 760.4,271.8 749.6,271.8" fill="#b3443a"/><text x="128" y="297" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#c17a24" text-anchor="middle">340 W/m²</text><text x="128" y="325" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#5b6776" text-anchor="middle">incoming</text><text x="395" y="303" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#27659a" text-anchor="middle">102 W/m²</text><text x="395" y="332" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#5b6776" text-anchor="middle">reflected</text><text x="672" y="303" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#b3443a" text-anchor="middle">238 W/m²</text><text x="672" y="332" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#5b6776" text-anchor="middle">thermal output*</text><rect x="148" y="460" width="670" height="55" rx="10" fill="#eef2f5" stroke="none" stroke-width="2"/><text x="481" y="495" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#222933" text-anchor="middle">Absorbed: 340 − 102 = 238 W/m²</text><text x="480" y="551" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#5b6776" text-anchor="middle">* Thermal output equals absorption at equilibrium</text></svg>