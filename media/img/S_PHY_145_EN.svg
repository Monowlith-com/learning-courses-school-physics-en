<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><rect x="0" y="0" width="960" height="600" fill="#fff" stroke="#fff" stroke-width="2" rx="0" /><text x="40" y="58" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="bold" text-anchor="start">Task demands and levels</text><text x="40" y="92" fill="#526273" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Three demand levels – not a fixed verb mapping</text><line x1="40" y1="110" x2="920" y2="110" stroke="#cfd6df" stroke-width="2" stroke-linecap="round" /><rect x="40" y="154" width="270" height="294" fill="#ffffff" stroke="#d0d7df" stroke-width="2" rx="7" /><text x="175" y="201" fill="#27659a" font-family="Arial,DejaVu Sans,sans-serif" font-size="43" font-weight="bold" text-anchor="middle">I</text><text x="175" y="247" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Recall</text><text x="175" y="320" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">Practised rules</text><text x="175" y="355" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">and procedures</text><rect x="348" y="154" width="270" height="294" fill="#ffffff" stroke="#d0d7df" stroke-width="2" rx="7" /><text x="483" y="201" fill="#26816e" font-family="Arial,DejaVu Sans,sans-serif" font-size="43" font-weight="bold" text-anchor="middle">II</text><text x="483" y="247" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Apply</text><text x="483" y="320" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">Transfer ideas to</text><text x="483" y="355" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">a related situation</text><rect x="656" y="154" width="270" height="294" fill="#ffffff" stroke="#d0d7df" stroke-width="2" rx="7" /><text x="791" y="201" fill="#8c5b9c" font-family="Arial,DejaVu Sans,sans-serif" font-size="43" font-weight="bold" text-anchor="middle">III</text><text x="791" y="247" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Reflect</text><text x="791" y="320" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">Judge independently</text><text x="791" y="355" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">and check the model</text><text x="480" y="510" fill="#222933" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Demand level depends on the full problem</text><text x="480" y="570" fill="#526273" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Schematic · not empirical measurements</text></svg>